sample:
  description: ANT+ Bicycle Speed and Cadence Receiver Sample
  name: ANT+ Bicycle Speed and Cadence Receiver
tests:
  sample.bsc_rx.dual_core:
    platform_allow: nrf5340dk_nrf5340_cpuapp
    integration_platforms:
      - nrf5340dk_nrf5340_cpuapp
    tags: ant
    build_only: true
    extra_args: ant_rpc_CONFIG_ANT_EVALUATION_KEY=y
  sample.bsc_rx.single_core:
    platform_allow: nrf52840dk_nrf52840
    integration_platforms:
      - nrf52840dk_nrf52840
    tags: ant
    build_only: true
    extra_args: CONFIG_ANT_EVALUATION_KEY=y