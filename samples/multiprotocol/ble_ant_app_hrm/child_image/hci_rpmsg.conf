# BT: Limit max BLE connections to conserve RAM.
CONFIG_BT_MAX_CONN=2

# ANT: Add ANT configurations to the hci_rpmsg defaults for dual stack ANT and BLE support.
CONFIG_ANT=y
CONFIG_ANT_NP=y
CONFIG_ANT_RPC=y
# ANT: Set CONFIG_ANT_EVALUATION_KEY to 'y' to apply the evaluation license.
CONFIG_ANT_EVALUATION_KEY=n

CONFIG_NRF_RPC=y
CONFIG_NRF_RPC_THREAD_STACK_SIZE=2048
CONFIG_THREAD_CUSTOM_DATA=y

CONFIG_HEAP_MEM_POOL_SIZE=4096