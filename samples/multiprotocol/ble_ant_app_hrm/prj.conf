CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_LOG=y
CONFIG_BOARD_ENABLE_CPUNET=y

CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_HRS=y
CONFIG_BT_DEVICE_NAME="Nordic_HRM"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_MAX_CONN=2

# ANT: Enable ANT and multicore serialization support.
CONFIG_ANT=y
CONFIG_ANT_NP=y

CONFIG_RESET_ON_FATAL_ERROR=n