CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y

CONFIG_MAIN_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y

# Workaround: Unable to allocate command buffer when using K_NO_WAIT since
# Host number of completed commands does not follow normal flow control.
CONFIG_BT_BUF_CMD_TX_COUNT=10

# Enable and adjust the below value as necessary
# CONFIG_BT_BUF_EVT_RX_COUNT=16
# CONFIG_BT_BUF_EVT_RX_SIZE=255
# CONFIG_BT_BUF_ACL_RX_SIZE=255
# CONFIG_BT_BUF_ACL_TX_SIZE=251
# CONFIG_BT_BUF_CMD_TX_SIZE=255

CONFIG_BT_MAX_CONN=2

# ANT: Add ANT configurations to the hci_ipc defaults for dual stack ANT and Bluetooth LE support.
CONFIG_ANT=y
# Evaluation key for ANT
# Set this Kconfig to use the evaluation stack for DUAL CORE builds (for example, nRF53 Series).
# You MUST obtain a valid commercial license key BEFORE releasing a product to market that uses ANT.
# For more information about licensing please see CONFIG_ANT_LICENSE_KEY and visit the website below:
# https://developer.garmin.com/ant-program/licensing/
CONFIG_ANT_EVALUATION_KEY=n

CONFIG_NRF_RPC=y
CONFIG_NRF_RPC_THREAD_STACK_SIZE=2048
CONFIG_THREAD_CUSTOM_DATA=y

CONFIG_HEAP_MEM_POOL_SIZE=4096